[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mudra"
version = "0.1.0"
description = "Control your Mac with your hands and your voice. Offline, open source, extensible."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
  "mediapipe==0.10.21",   # also brings opencv (cv2) and numpy<2
  "pynput>=1.7.6",
  "pyobjc-framework-Quartz; sys_platform == 'darwin'",
  "faster-whisper>=1.0.0",
  "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mudra = "mudra.__main__:main"

[tool.setuptools]
packages = ["mudra"]

[tool.setuptools.package-data]
mudra = ["default.toml", "default_win.toml"]
